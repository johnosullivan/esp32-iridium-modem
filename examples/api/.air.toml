# Live reload for the RockBLOCK webhook API (github.com/air-verse/air).
# Install: go install github.com/air-verse/air@latest
# Run:     make run   (or: air)

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go$", "_enum\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
